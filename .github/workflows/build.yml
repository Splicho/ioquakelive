name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows_only:
        description: 'Only the Windows x64 build, without publishing: no Linux, no macOS, no ARM64'
        type: boolean
        default: false

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.windows_only) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - runner: ubuntu-22.04
          arch: x86_64
        - runner: ubuntu-22.04-arm
          arch: arm64
    env:
      BIN_ARCH: ${{ matrix.arch }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Official build key
      if: github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'release:') || startsWith(github.event.head_commit.message, 'prerelease:'))
      shell: bash
      env:
        OFFICIAL_MASTER: ${{ secrets.IOQL_OFFICIAL_MASTER }}
      run: |
        if [ -n "$OFFICIAL_MASTER" ]; then
          VERSION=$(sed -n 's/^#define PRODUCT_VERSION "\(.*\)"/\1/p' code/qcommon/q_shared.h)
          KEY=$(printf '%s' "$VERSION" | openssl dgst -sha256 -hmac "$OFFICIAL_MASTER" -r | cut -d' ' -f1)
          echo "::add-mask::$KEY"
          printf '#define IOQL_BUILD_KEY "%s"\n' "$KEY" > code/qcommon/official_key.h
        fi
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake ninja-build \
          libfreetype-dev libogg-dev libvorbis-dev \
          libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev \
          libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libdecor-0-dev \
          libegl1-mesa-dev libgl1-mesa-dev libgles2-mesa-dev libdrm-dev libgbm-dev \
          libasound2-dev libpulse-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev
    - name: Build SDL3 from submodule
      run: |
        cmake -S code/SDL3 -B build/SDL3 -G Ninja -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/sdl3-local" -DCMAKE_INSTALL_LIBDIR=lib \
          -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TEST_LIBRARY=OFF
        cmake --build build/SDL3
        cmake --install build/SDL3
    - name: Compile
      run: |
        export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/sdl3-local/lib/pkgconfig"
        make release -j$(nproc)
    - name: Stage build outputs
      run: |
        mkdir -p staging/libs staging/engine
        cp build/release-linux-$BIN_ARCH/baseq3/cgame$BIN_ARCH.so  staging/libs/
        cp build/release-linux-$BIN_ARCH/baseq3/qagame$BIN_ARCH.so staging/libs/
        cp build/release-linux-$BIN_ARCH/baseq3/ui$BIN_ARCH.so     staging/libs/
        cp -L "$GITHUB_WORKSPACE/sdl3-local/lib/libSDL3.so.0" build/release-linux-$BIN_ARCH/
        tar -C build/release-linux-$BIN_ARCH -cf staging/engine/linux-$BIN_ARCH.tar \
          ioquakelive.$BIN_ARCH ioquakelive-vulkan.$BIN_ARCH opengl2$BIN_ARCH.so opengl1$BIN_ARCH.so vulkan$BIN_ARCH.so libSDL3.so.0
    - uses: actions/upload-artifact@v4
      with:
        name: libs-linux-${{ matrix.arch }}
        path: staging/libs/
        retention-days: 2
    - uses: actions/upload-artifact@v4
      with:
        name: engine-linux-${{ matrix.arch }}
        path: staging/engine/
        retention-days: 2

  windows:
    name: Windows ${{ matrix.platform }}
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'prerelease:'))
    runs-on: windows-2025-vs2026
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' && inputs.windows_only) && '[{"platform":"x64","dir":"x64","arch":"x86_64"}]' || '[{"platform":"x64","dir":"x64","arch":"x86_64"},{"platform":"ARM64","dir":"arm64","arch":"arm64"}]') }}
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Official build key
      if: github.event_name == 'push' && (startsWith(github.event.head_commit.message, 'release:') || startsWith(github.event.head_commit.message, 'prerelease:'))
      shell: bash
      env:
        OFFICIAL_MASTER: ${{ secrets.IOQL_OFFICIAL_MASTER }}
      run: |
        if [ -n "$OFFICIAL_MASTER" ]; then
          VERSION=$(sed -n 's/^#define PRODUCT_VERSION "\(.*\)"/\1/p' code/qcommon/q_shared.h)
          KEY=$(printf '%s' "$VERSION" | openssl dgst -sha256 -hmac "$OFFICIAL_MASTER" -r | cut -d' ' -f1)
          echo "::add-mask::$KEY"
          printf '#define IOQL_BUILD_KEY "%s"\n' "$KEY" > code/qcommon/official_key.h
        fi

    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Build SDL3 for ARM64
      if: matrix.platform == 'ARM64'
      shell: pwsh
      run: ./code/tools/Build-SDL3.ps1

    - name: Build Solution
      run: msbuild misc/msvc/ioquakelive.sln /p:Configuration=Release /p:Platform=${{ matrix.platform }} /p:PlatformToolset=v145 /m

    - name: Stage build outputs
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path staging/libs   | Out-Null
        New-Item -ItemType Directory -Force -Path staging/engine | Out-Null
        Copy-Item build/Release/${{ matrix.dir }}/baseq3/cgame${{ matrix.arch }}.dll  staging/libs/
        Copy-Item build/Release/${{ matrix.dir }}/baseq3/qagame${{ matrix.arch }}.dll staging/libs/
        Copy-Item build/Release/${{ matrix.dir }}/baseq3/ui${{ matrix.arch }}.dll     staging/libs/
        Copy-Item build/Release/${{ matrix.dir }}/*.exe staging/engine/
        Copy-Item build/Release/${{ matrix.dir }}/*.dll staging/engine/
    - uses: actions/upload-artifact@v4
      with:
        name: libs-windows-${{ matrix.dir }}
        path: staging/libs/
        retention-days: 2
    - uses: actions/upload-artifact@v4
      with:
        name: engine-windows-${{ matrix.dir }}
        path: staging/engine/
        retention-days: 2

  package:
    name: Package release artifacts
    if: (github.event_name == 'workflow_dispatch' && !inputs.windows_only) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'prerelease:'))
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Download engine artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: engine-*
        path: engines
    - name: Unpack tarred engine artifacts
      run: |
        for tar in engines/engine-linux-x86_64/linux-x86_64.tar \
                   engines/engine-linux-arm64/linux-arm64.tar; do
          if [ -f "$tar" ]; then
            tar -xf "$tar" -C "$(dirname "$tar")"
            rm "$tar"
          fi
        done
        ls -l engines/engine-linux-x86_64/ioquakelive.x86_64
        ls -l engines/engine-linux-arm64/ioquakelive.arm64
    - name: Download game library artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: libs-*
        path: iobin-stage
        merge-multiple: true
    - name: Build universal iobin.pk3
      run: |
        mkdir -p shared/baseq3
        python3 code/tools/make_deterministic_pk3.py \
          --input iobin-stage \
          --output shared/baseq3/iobin.pk3
        shasum -a 256 shared/baseq3/iobin.pk3
    - name: Build deterministic pak01.pk3
      run: |
        python3 code/tools/make_deterministic_pk3.py \
          --input content/pak01 \
          --output shared/baseq3/pak01.pk3
        shasum -a 256 shared/baseq3/pak01.pk3
    - name: Verify shared artifact hashes
      run: sha256sum shared/baseq3/iobin.pk3 shared/baseq3/pak01.pk3
    - name: Build per-platform release zips
      run: |
        VERSION=$(sed -n 's/^#define PRODUCT_VERSION "\(.*\)"/\1/p' code/qcommon/q_shared.h)
        python code/tools/build_release_zips.py \
          --shared shared \
          --engines engines \
          --output release \
          --version "$VERSION"
        ls -la release/
        sha256sum release/*
    - uses: actions/upload-artifact@v4
      with:
        name: release-zips
        path: release/
        retention-days: 2

  package-windows:
    name: Package the Windows pre-release
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.windows_only }}
    needs: [windows]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Download game library artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: libs-windows-*
        path: iobin-stage
        merge-multiple: true
    - name: Build iobin.pk3
      run: |
        mkdir -p shared/baseq3
        python3 code/tools/make_deterministic_pk3.py \
          --input iobin-stage \
          --output shared/baseq3/iobin.pk3
    - name: Build deterministic pak01.pk3
      run: |
        python3 code/tools/make_deterministic_pk3.py \
          --input content/pak01 \
          --output shared/baseq3/pak01.pk3
    - name: Download engine artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: engine-windows-*
        path: engines
    - name: Build the release zips
      run: |
        python code/tools/build_release_zips.py \
          --shared shared \
          --engines engines \
          --output build
        ls -la build/
        sha256sum build/*.zip
    - uses: actions/upload-artifact@v4
      with:
        name: release-zips
        path: build/*.zip
        retention-days: 2

  prerelease:
    name: Create Pre-release
    needs: [package]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'prerelease:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@v4
    - name: Extract version from commit message
      id: version
      env:
        MSG: ${{ github.event.head_commit.message }}
      run: |
        VERSION=$(echo "$MSG" | head -1 | sed 's/^prerelease: *//')
        CODE=$(sed -n 's/^#define PRODUCT_VERSION "\(.*\)"/\1/p' code/qcommon/q_shared.h)
        if [ "$CODE" != "$VERSION" ]; then
          echo "::error::prerelease: ${VERSION}, but PRODUCT_VERSION in code/qcommon/q_shared.h is ${CODE}"
          exit 1
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
    - name: Create tag
      run: |
        git tag "${{ steps.version.outputs.tag }}"
        git push origin "${{ steps.version.outputs.tag }}"
    - uses: actions/download-artifact@v4
      with:
        name: release-zips
        path: artifacts
    - uses: actions/attest-build-provenance@v4
      with:
        subject-path: 'artifacts/*'
    - name: Create Pre-release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.version }} (experimental)
        files: artifacts/*
        prerelease: true

  release:
    name: Create Release
    needs: [package]
    if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'release:')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@v4
    - name: Extract version from commit message
      id: version
      env:
        MSG: ${{ github.event.head_commit.message }}
      run: |
        VERSION=$(echo "$MSG" | head -1 | sed 's/^release: *//')
        CODE=$(sed -n 's/^#define PRODUCT_VERSION "\(.*\)"/\1/p' code/qcommon/q_shared.h)
        if [ "$CODE" != "$VERSION" ]; then
          echo "::error::release: ${VERSION}, but PRODUCT_VERSION in code/qcommon/q_shared.h is ${CODE}"
          exit 1
        fi
        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
    - name: Create tag
      run: |
        git tag "${{ steps.version.outputs.tag }}"
        git push origin "${{ steps.version.outputs.tag }}"
    - uses: actions/download-artifact@v4
      with:
        name: release-zips
        path: artifacts
    - uses: actions/attest-build-provenance@v4
      with:
        subject-path: 'artifacts/*'
    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: ${{ steps.version.outputs.version }}
        files: artifacts/*
        generate_release_notes: true
